 overview:{title:'A 35B MoE in phone memory.',body:'The edge0 preview is the same 40-layer Qwen3.6-35B-A3B MoE — 256 experts per layer, 8 routed per token, 3B active — re-quantized to MLX affine int4 and shipped with two small trained adapters. The trick is not the file size: it is that the 19.7 GB checkpoint stays on storage and experts are streamed in as they are routed, so only the active set is ever in RAM.'},
 expert:{title:'256 experts, 8 per token.',body:'Each layer stores its experts fused in the BF16 base: [256, 1024, 2048] for gate_up and [256, 2048, 512] for down — 8.4 GB of the 71.9 GB base is expert mass at BF16. Only 8 of the 256 fire per token, and the shared expert (512-wide) always runs beside them. In the int4 build the whole bank is one SwitchLinear per projection, packed as U32 weights with group-64 scales and biases.'},

 renderGuide(){return html`<div><div class="inspect-path">A READING GUIDE TO THE ANIMATION</div><h2 class="editorial">Follow the data.<br/><em>Read the weights.</em></h2><p class="lede">The solids are learned tensors. The moving lights are explanatory signals. Do not read the size of a weight as its runtime workload.</p>
 <${Section} title="Start with a gated-linear layer"><p class="guide-copy">Open L00. A fused q/k/v projection feeds a kernel-4 convolution and a gated recurrence whose state is a fixed 32 × 128 × 128 block — it does not grow with the prompt. Then the feed-forward: 8 of 256 experts plus the shared expert.</p><button class="outline-btn full-width" onClick=${()=>{this.select('L0');this.patch({tab:'inspect'});}}>Open L00: a gated-linear layer</button><//>
 <${Section} title="Compare a full-attention layer"><p class="guide-copy">Now open L03. Sixteen query heads over just two KV heads at head_dim 256, with per-head q and k norms, and a KV cache that grows with the context. Only these ten layers pay for long prompts.</p><button class="outline-btn full-width" onClick=${()=>{this.select('L3');this.patch({tab:'inspect'});}}>Open L03: the first full layer</button><//>
 <${Section} title="Where the 8.4 GB lives"><p class="guide-copy">Open any layer and switch the inspector to Experts, or press X: 256 specialists per layer, [256, 1024, 2048] for gate_up and [256, 2048, 512] for down. Eight run per token; all 256 are stored, and at BF16 they are the bulk of the checkpoint.</p><button class="outline-btn full-width" onClick=${()=>{this.select('L3');this.patch({expertView:true,tab:'inspect'});}}>Open L03: unfold all 256 experts</button><//>
 <${Section} title="Then look at the two adapters"><p class="guide-copy">The edge build ships 180 MB of adapters next to a 19.7 GB checkpoint. LoRA (620 tensors, 42.3 MB) corrects the 4-bit error on attention and the shared expert; the prerouter (99 tensors, 138.4 MB, 33 layers) predicts routing one step ahead so the SSD fetch overlaps compute. Together they are 0.9% of the file.</p><button class="outline-btn full-width" onClick=${()=>{this.select('aligner');this.patch({tab:'inspect'});}}>Open the prerouter heads</button><//>
 <${Section} title="Three distinctions worth keeping"><div class="layer-story"><h3>Stored is not active.</h3><p>Eight of 256 experts are chosen per token, but all 256 remain in the checkpoint. Illumination changes, volume does not — and the under-3-GiB claim is about the active set, not the file.</p><h3>A fused bank is not a per-expert file.</h3><p>BF16 writes experts as one fused tensor per layer; FP8 writes them one by one. The same parameters, 1,045 tensors against 64,196 — bookkeeping, not architecture.</p><h3>A quantizer ignores more than it converts.</h3><p>The int4 build keeps 80 router modules at 8-bit on purpose and drops the vision tower entirely. Read the config and the ignore list before believing a compression ratio.</p></div><//>
 <${Section} title="A byte-true view, with limits"><p class="guide-copy">Every solid uses 1 cubic world unit per decimal GB of modeled payload. Its three dimensions multiply to that volume, including throughout the morph. Aspect ratio is chosen for readability; it is not the literal matrix shape. Small picking dots, links and labels carry no bytes.</p><p class="guide-copy">Every total on this page is measured: the three checkpoints were read header by header over HTTP Range and summed tensor by tensor. The audit panel in Sources runs the same arithmetic on shards you already have.</p><button class="text-link" onClick=${()=>this.patch({modal:'audit'})}>Audit local Safetensors headers <${Icon} name="arrow" size=${14}/></button><//></div>`;}
 renderStorage(){const s=this.state,selected=s.selected&&s.selected.startsWith('cat:')?CATEGORIES.find(c=>'cat:'+c[0]===s.selected):null;return html`<div><div class="inspect-path">PARAMETERS / FORMATS / BYTES</div><h2 class="editorial">Storage, <em>honestly.</em></h2><p class="lede">Mass is conserved as the architecture unfolds. Compare the same logical weights in different formats.</p><div class="storage-total"><small>${MODE_INFO[s.precision].note.toUpperCase()}</small><strong>${bytes(TOTALS[s.precision],s.binary)}</strong><span>Measured: every shard header read, tensor by tensor</span></div>
 <${Note} color=${MODE_INFO[s.precision].color}><strong>${EXP[s.precision].title}</strong> ${EXP[s.precision].body}<//>
 <${Section} title="Payload by component" tag=${selected?'SELECTED: '+selected[0].toUpperCase():'ALL MODULES'}>${CATEGORIES.map(([id,name,c,ws])=>{let b=sumB(ws,s.precision),active=selected&&selected[0]===id;return html`<button class=${'category-row'+(active?' active':'')} onClick=${()=>this.patch({selected:'cat:'+id})}><div><i style=${{background:c}}/><span>${name}</span><b>${bytes(b,s.binary)}</b></div><span class="mini-track"><i style=${{width:b/TOTALS[s.precision]*100+'%',background:c}}/></span><small>${fmtP(sumP(ws))} parameters <span>${(b/TOTALS[s.precision]*100).toFixed(2)}%</span></small></button>`;})}<//>
 <${Section} title="Three precisions, one architecture"><div class="equation"><span>BF16</span><code>2 B / parameter</code><span>FP8</span><code>1 B + block scales</code><span>INT4 g64</span><code>0.5 B + scales and biases</code></div><${Fact} label="FP8 saves" value=${bytes(FP8_DELTA,s.binary)} color=${COL.dec}/><${Fact} label="Edge0 int4 saves" value=${bytes(E0_DELTA,s.binary)} color=${COL.expert}/><p class="fine">The edge build is smaller than a clean 4× would suggest, for reasons that are visible in the file: experts are packed at 4 bits, but the 80 router modules stay at 8-bit, the norms stay BF16, and the LoRA and prerouter adapters are added on top rather than replacing anything.</p><//>
 <${Section} title="Audit, rather than guess"><p class="fine">The 510 GB upstream listing is consistent with this estimate, but rounded. Inspect local Safetensors headers for exact stored tensor bytes, including scale tensors. No weights are loaded or uploaded.</p><button class="outline-btn full-width" onClick=${()=>this.patch({modal:'audit'})}><${Icon} name="expand" size=${16}/> Audit local checkpoint headers</button><button class="text-link" onClick=${()=>this.exportLedger()}>Export derived tensor ledger <${Icon} name="download" size=${14}/></button><//>
 <details class="assumptions"><summary>Accounting assumptions and limits</summary><p>Tensor payload only: shard headers, file padding and exporter metadata are excluded, so these are not download sizes.</p><p>Per-expert tensors are folded into the fused banks the BF16 base stores, and quantization scales and biases (weight_scale_inv, scales, biases) are folded into their owner. That is why all three modes show the same logical tensor list even though the FP8 repo has 64,196 tensors and the base has 1,045.</p><p>The FP8 checkpoint also ships one MTP layer (mtp.layers.0, 0.8537 GB) that the BF16 base and the edge build do not have. It is shown as its own module rather than hidden inside a rounding error. Active memory, SSD bandwidth and throughput are runtime quantities and are not modelled here.</p></details></div>`;}
 renderCache(){const s=this.state,n=s.context,linear=KV_LINEAR_STATE,full=n*KV_FULL_PER_TOKEN;return html`<div><div class="inspect-path">CONTEXT COST / TWO KINDS OF MEMORY</div><h2 class="editorial">Thirty constant.<br/><em>Ten that grow.</em></h2><p class="lede">The gated-linear layers carry a fixed recurrent state; only the ten full-attention layers keep a KV cache.</p><div class="storage-total cache-total"><small>FULL-ATTENTION CACHE / TOKEN</small><strong>20,480 <em>bytes</em></strong><span>10 layers × 2 KV heads × 256 dims × 2 tensors × 2 bytes</span></div>
 <${Section} title="Stretch the context" tag="UP TO 262,144"><label class="range-title" for="context-number">Context tokens <input id="context-number" type="number" min="128" max="262144" step="128" value=${n} onChange=${e=>{const v=Number(e.target.value);this.patch({context:clamp(Number.isFinite(v)?Math.round(v):128,128,262144)});}}/></label><input class="slider" aria-label="Context length logarithmic slider" type="range" min="7" max="18" step="0.05" value=${Math.log2(n)} onInput=${e=>this.patch({context:clamp(Math.round(2**Number(e.target.value)),128,262144)})}/><div class="range-ends"><span>128</span><span>8K</span><span>256K</span></div><div class="preset-row">${[16384,65536,131072,262144].map(v=>html`<button class=${n===v?'active':''} onClick=${()=>this.patch({context:v})}>${v===262144?'256K':v/1024+'K'}</button>`)}</div><${Fact} label="Full-attention KV" value=${bytes(full,s.binary)} color=${COL.full}/><${Fact} label="Recurrent state (fixed)" value=${bytes(linear,s.binary)} color=${COL.swa}/><p class="fine">The recurrent figure does not depend on the context: 30 layers × 32 value heads × 128 × 128 keys at two bytes. Long prompts cost the linear layers nothing extra.</p><//>
 <${Section} title="Where these numbers come from"><div class="equation"><span>FULL LAYER / TOKEN</span><code>(2 × 256) × 2 × 2 B = 2,048 B</code><span>ALL TEN / TOKEN</span><code>2,048 × 10 = 20,480 B</code><span>RECURRENT / LAYER</span><code>32 × 128 × 128 × 2 B = 1.05 MB</code></div><p class="fine">BF16 arithmetic from the published shapes. The full-attention cache is what an SSD-offloaded runtime has to keep in RAM; the recurrent states are what it keeps instead of a KV cache in the other thirty layers.</p><//>
 <${Section} title="What the int4 build actually costs" tag="GROUP 64"><${Fact} label="Packed weights" value="0.5 B / parameter"/><${Fact} label="Scales + biases" value="~0.031 B / parameter"/><${Fact} label="8-bit overrides" value="80 router modules"/><${Fact} label="Vision tower" value="dropped in this build"/><${Fact} label="Adapters" value="180.7 MB on top"/><p class="fine">Affine 4-bit stores one scale and one bias per group of 64 values, so a packed row costs 0.5 B plus 4 bytes per 64 weights. The measured 19.6895 GB includes the two adapter files; the four model shards alone are smaller.</p><//><${Note} color=${COL.full}>KV and state figures are arithmetic from the published config, not measured device memory. The runtime also holds activations, the active expert set and the SSD staging buffers — none of which are checkpoint bytes.<//></div>`;}
 renderBench(){const s=this.state,b=BENCH[s.bench];return html`<div><div class="inspect-path">PUBLISHER-REPORTED LEADERBOARD / AS PUBLISHED</div><h2 class="editorial">Capability,<br/><em>with context.</em></h2><p class="lede">Scores collected from each model\u2019s own card by the original atlas page. This page measures bytes and claims no scores of its own; Edge0-35B-A3B is not in that publisher set; its own card figure is added as the first row wherever the card reports the same benchmark, and a blank cell means the card does not publish it.</p><label class="field-label">Compare a benchmark<select value=${s.bench} onChange=${e=>this.patch({bench:Number(e.target.value)})}>${BENCH.map((r,i)=>html`<option value=${i}>${r[0]}</option>`)}</select></label><div class="benchmark-chart">${BENCH_MODELS.map((name,i)=>html`<div class=${'benchmark-row'+(i===0?' featured':'')}><div><span>${name}</span><b>${b[2][i]===null?'Not reported':b[2][i].toFixed(1)}</b></div><div class="bench-track"><i style=${{width:(b[2][i]||0)+'%',background:i===0?COL.dec:COL.enc,opacity:i===0?1:.32}}/></div></div>`)}</div><p class="fine">${b[0]} / ${b[1]}. Percentages or the card's 0-100 score; ZeroBench uses Pass@5, ProgramBench Almost@1, DeepSWE resolved rate. Do not average unlike metrics.</p><div class="card-bench"><div class="inspect-path">PUBLISHER CARD / THIS CHECKPOINT</div><p class="card-lede">Every benchmark this checkpoint&rsquo;s own card reports, with the card&rsquo;s own comparison columns, reproduced unchanged. Where a row in the series chart above reads &ldquo;Not reported&rdquo;, the card does not publish that benchmark.</p><div class="card-scroll"><table class="card-table"><thead><tr>${CARD_BENCH.headers.map(h=>html`<th>${h}</th>`)}</tr></thead><tbody>${CARD_BENCH.rows.map(r=>r[0].startsWith("== ")?html`<tr class="sec"><td colSpan=${CARD_BENCH.headers.length}>${r[0].slice(3)}</td></tr>`:html`<tr>${r.map((c,i)=>html`<td class=${i===0?"lbl":(i===1?"num own":"num")}>${c}</td>`)}</tr>`)}</tbody></table></div><p class="fine">Source: <a href="https://huggingface.co/${CARD_BENCH.src}" target="_blank" rel="noopener">${CARD_BENCH.src}</a> model card, retrieved 2026-09-15. Values are the publisher&rsquo;s; this page measures bytes and adds no numbers.</p></div>
 <${Section} title="Evaluation conditions"><${Fact} label="Quantization" value="MLX affine int4 / group 64"/><${Fact} label="8-bit overrides" value="mlp.gate + shared_expert_gate"/><${Fact} label="Adapters" value="Recover-LoRA, distillation"/><${Fact} label="Runtime" value="edge0 streaming, under 3 GiB"/><p class="fine">The vision row only applies to the base checkpoints: the edge preview has no vision tower, so a text-only build cannot be scored on image benchmarks. Harnesses and protocols differ per benchmark; see the card.</p><${Note} color=${COL.expert}>Publisher-reported scores. This page measures bytes; it does not evaluate the int4 build, and no quality equivalence is claimed for FP8.<//><//>
 <${Section} title="What the edge build trades away"><label class="range-title">parameters kept at fp16 <output>${(100-s.effort*.8).toFixed(0)}%</output></label><input class="slider" type="range" min="1" max="100" value=${s.effort} aria-label="Illustrative precision trade-off" onInput=${e=>this.patch({effort:Number(e.target.value)})}/><pre class="small-code">${JSON.stringify({base_bits:4,group_size:64,overrides_8bit:80,adapters_MB:180.7},null,2)}</pre><p class="fine">A slider that only illustrates the trade-off: routers stay at 8 bits because routing is discrete, adapters carry the correction, and the vision tower was removed rather than compressed.</p><//></div>`;}
 renderSources(){return html`<div><div class="inspect-path">PROVENANCE / MEASURED FROM PUBLISHED SHARDS</div><h2 class="editorial">Trace every<br/><em>assumption.</em></h2><p class="lede">The card supplies the claims. The configs supply the shapes. The shard headers supply the bytes — all three modes here were read over HTTP Range, not estimated.</p><div class="source-status"><i/> Offline app / no runtime requests</div>
 <${Section} title="Primary sources">${SOURCES.map(([name,url,desc],i)=>html`<div class="source-row"><span>${String(i+1).padStart(2,'0')}</span><div><a href=${url} target="_blank" rel="noopener noreferrer">${name} <${Icon} name="arrow" size=${11}/></a><p>${desc}</p></div></div>`)}<//>
 <${Section} title="What each repository actually contains"><p class="fine">The BF16 base writes 256 experts as one fused bank per layer, ships an untied 248,320-row head and includes the vision tower. The FP8 build writes experts per expert, carries per-block weight_scale_inv tensors (64,196 tensors total) and adds one MTP layer the base does not have. The edge preview has four model shards, no vision tensors, and two separate adapter files.</p><${Fact} label="BF16 base" value="71.9036 GB / 26 shards"/><${Fact} label="FP8 build" value="37.4548 GB / 42 shards"/><${Fact} label="Edge0 int4" value="19.6895 GB / 6 files"/><${Fact} label="MTP layer" value="0.8537 GB / FP8 only"/><//>
 <${Section} title="Inspect the inputs"><div class="action-grid"><button class="outline-btn" onClick=${()=>this.patch({modal:'config'})}>Embedded configs</button><button class="outline-btn" onClick=${()=>this.exportLedger()}>Export byte ledger</button></div><button class="outline-btn full-width" onClick=${()=>this.patch({modal:'audit'})}>Audit local Safetensors headers</button><//>
 <${Section} title="Tower, split and the three modes"><p class="fine">The tower is a logical layer-order view, not a map of safetensors byte offsets. Splitting moves the same 40 objects into two reading groups; it does not create a second stack, and both layouts use the exact same tensor inventory.</p><p class="fine">The animation walks Route → Fetch → Compute → Decode → Adapt: routing, the SSD expert fetch, the forward pass itself, the decode cadence reported by the card, and the adapter that corrects the 4-bit weights. Nothing here executes a model, and no throughput is simulated.</p><p class="fine">Training mode illustrates the Recover-LoRA recipe in outline — frozen int4 student, FP teacher, gradients to the adapters only. It is a schematic, not the authors’ training code.</p><//>
 <${Section} title="Interpretation rules"><p class="fine">35B parameters with 3B active per token and the under-3-GiB memory figure are the publisher’s claims. The measured total here is ${fmtP(TOTAL_P)} stored logical values across 1,045 base tensors — audited tensor by tensor from the shard headers of the three repositories.</p><p class="fine">Routing, fetch, compute and adapter animations are explanatory. No inference runs. The timeline is not a latency chart and no weight data is bundled in this HTML.</p><p class="fine">Volumes, not footprint areas: unfolding experts conserves modelled mass, and zooming never alters the byte scale. KV and recurrent-state figures are arithmetic from published shapes, not measured device memory.</p><//>
 <${Section} title="Implementation"><p class="fine">Preact + HTM, with an embedded, instanced WebGL2 renderer and a Canvas2D software-projection fallback. All code and data live in this file. No CDN, fonts, textures, build tool or server is required.</p><button class="text-link" onClick=${()=>this.patch({modal:'credits'})}>Credits and third-party licenses <${Icon} name="arrow" size=${14}/></button><//></div>`;}
 renderInspector(){const s=this.state,m=MODULES.find(x=>x.id===s.selected);return html`<div class=${'inspector-dock'+(s.panelHidden?' collapsed':'')}><aside id="inspector-panel" inert=${s.mobile?!s.sheet:s.panelHidden} aria-hidden=${s.mobile?!s.sheet:s.panelHidden} class=${'inspector'+(s.sheet?' sheet-open':'')} onPointerMove=${e=>this.blankMove(e,'right')} onPointerLeave=${e=>e.currentTarget.classList.remove('blank-right')} onPointerDown=${e=>this.blankDown(e,'right')} onPointerUp=${e=>this.blankUp(e,'right')}><div class="inspector-top"><div class="panel-tabs">${[['inspect','Inspector'],['guide','Guide'],['bench','Benchmarks'],['sources','Sources']].map(([tab,label])=>html`<button class=${s.tab===tab?'active':''} onClick=${()=>this.patch({tab})}>${label}</button>`)}</div><button class="icon-button panel-collapse" aria-label="Hide inspector" title="Hide inspector (B). You can also click blank panel space." onClick=${()=>this.hidePanel()}><${Icon} name="arrow"/></button></div><div class="inspector-nav"><span>${s.tab==='inspect'?(m?m.label:s.view==='storage'?'Checkpoint ledger':s.view==='cache'?'Global KV cache':'Model overview'):s.tab==='bench'?'Model-card comparisons':'Evidence and methodology'}</span><div>${s.tab==='inspect'&&s.view==='architecture'&&html`<button aria-label="Previous module" onClick=${()=>this.walk(-1)}><${Icon} name="up" size=${12}/></button><button aria-label="Next module" onClick=${()=>this.walk(1)}><${Icon} name="down" size=${12}/></button>`}${s.selected&&html`<button aria-label="Clear selected module" onClick=${()=>{this.patch({selected:null,tensor:null,expert:null,filter:'all'});this.engine&&this.engine.reset();}}><${Icon} name="close" size=${11}/></button>`}</div></div><div class="inspector-scroll" ref=${this.panelRef}>${s.tab==='guide'?this.renderGuide():s.tab==='bench'?this.renderBench():s.tab==='sources'?this.renderSources():s.view==='storage'?this.renderStorage():s.view==='cache'?this.renderCache():m?this.renderModule(m):this.renderOverview()}</div><div class="inspector-foot"><span><i/> MEASURED FROM SHARD HEADERS</span><button onClick=${()=>this.patch({binary:!s.binary})} title="Toggle decimal and binary byte units">${s.binary?'GiB / binary':'GB / decimal'}</button></div></aside></div>`;}
 renderModal(){const s=this.state;if(!s.modal)return null;let title={help:'Explore the model',config:'Embedded configurations',audit:'Safetensors header audit',credits:'Credits & licenses'}[s.modal];return html`<div class="modal-backdrop" onClick=${e=>{if(e.target===e.currentTarget)this.patch({modal:null});}}><div class=${'modal '+(s.modal==='config'?'wide':'')} role="dialog" aria-modal="true" aria-label=${title}><div class="modal-head"><div><div class="eyebrow">EDGE0 MODEL ATLAS</div><h2>${title}</h2></div><button class="icon-button" aria-label="Close dialog" onClick=${()=>this.patch({modal:null})}><${Icon} name="close"/></button></div><div class="modal-body">
 ${s.modal==='help'&&html`<p class="lede">A file to keep, inspect and share. Everything needed to render the atlas is embedded.</p><div class="help-grid">${[['V','Merge tower / separate the two reading groups'],['B / T','Hide inspector / animation panel'],['+ / -','Increase / decrease all text'],['Blank panel background','Click the arrow cursor to collapse; text is protected'],['Drag','Orbit the model'],['Right-drag / Shift-drag','Pan in camera space'],['Wheel / pinch','Zoom without changing scale'],['Click a layer','Open named weight tensors'],['Click a labeled weight','Pin its role, shape and bytes'],['F / X','Columns or floor / banks or experts'],['[ / ]',"Walk the layer\u2019s tensor list"],['Click an expert','Split its gate-up and down bank'],['Two-finger drag','Pan on touch screens'],['R / double-click','Reset the camera'],['P','Cycle BF16 / FP8 / Edge0 int4'],['Space','Pause or resume the story'],['Up / Down','Previous or next module'],['L / K','Toggle labels / flow paths'],['1 / 2 / 3','Architecture / Storage / Context']].map(([k,v])=>html`<div><kbd>${k}</kbd><span>${v}</span></div>`)}</div><${Note}>The animation starts in Compute and loops that phase. Choose another phase or turn off Loop phase to play the whole story. Tower order is not disk order; Split moves the same objects. Training mode illustrates the distillation recipe, not a second checkpoint. Routing is synthetic. Solids represent measured stored bytes, not device utilization, FLOPs or measured throughput.<//><button class="outline-btn full-width" onClick=${()=>this.patch({modal:'audit'})}>Check exact bytes from local checkpoint headers</button>`}
 ${s.modal==='config'&&html`<div class="config-switch">${['bf16','fp8','edge0'].map(m=>html`<button class=${(s.configMode||'bf16')===m?'active':''} onClick=${()=>this.patch({configMode:m})}>${m==='bf16'?'Qwen3.6 base':m==='fp8'?'Qwen3.6 FP8':'Edge0 int4'}</button>`)}</div><p class="fine">The released configs, embedded field for field. The Edge0 tab includes its MLX quantization block and the 80 per-module 8-bit overrides; the FP8 tab includes Qwen’s fp8 recipe.</p><pre class="config-code">${JSON.stringify(s.configMode==='edge0'?E0_CONFIG:s.configMode==='fp8'?FP8_CONFIG:CFG,null,2)}</pre><button class="outline-btn" onClick=${()=>safeDownload((s.configMode||'bf16')+'-config.json',JSON.stringify(s.configMode==='edge0'?E0_CONFIG:s.configMode==='fp8'?FP8_CONFIG:CFG,null,2))}><${Icon} name="download" size=${16}/> Save config.json</button>`}
 ${s.modal==='audit'&&html`<p class="lede">Exact disk measurements, without loading the model.</p><p>Choose local <code>.safetensors</code> shards from a single checkpoint. Only their eight-byte prefixes and JSON headers are read. Tensor byte ranges are validated against file sizes. No data leaves this page.</p><${Note} color=${COL.full}>The result covers only selected files. It does not certify completeness, infer logical FP4 parameters from I8 shapes, or silently replace the measured 3D scene.<//><input ref=${this.fileRef} type="file" accept=".safetensors" multiple hidden onChange=${e=>this.audit([...e.target.files])}/><button class="audit-picker" disabled=${s.auditing} onClick=${()=>this.fileRef.current.click()}><${Icon} name="expand" size=${24}/><b>${s.auditing?'Reading headers '+(s.auditProgress||''):'Choose checkpoint shards'}</b><small>Files stay on this device / header limit 64 MiB per shard</small></button>${s.auditError&&html`<div class="error-note" role="alert">${s.auditError}</div>`}
 ${s.audit&&html`<${Section} title="Measured selected files" tag="EXACT DATA_OFFSETS"><${Fact} label="Selected shards / tensors" value=${s.audit.results.length+' / '+num(s.audit.tensorCount)}/><${Fact} label="Stored tensor payload" value=${bytes(s.audit.payload,s.binary)} color=${COL.dec}/><${Fact} label="Actual selected file sizes" value=${bytes(s.audit.fileBytes,s.binary)}/><${Fact} label="Headers including prefixes" value=${bytes(s.audit.headerBytes,s.binary)}/><${Fact} label="Other / gaps / padding" value=${num(s.audit.fileBytes-s.audit.payload-s.audit.headerBytes)+' B'}/><div class="audit-groups">${Object.entries(s.audit.groups).sort((a,b)=>b[1]-a[1]).map(([k,v])=>html`<${Fact} label=${k} value=${bytes(v,s.binary)}/>` )}</div><p class="fine">Groups use tensor names. Unmapped names still count in the exact total. Scale and auxiliary tensors are measured too. The scene remains the labeled derived model.</p><button class="outline-btn full-width" onClick=${()=>safeDownload('edge0-35b-shard-audit.json',JSON.stringify({scope:'Selected local files only; completeness not verified',...s.audit},null,2))}>Export exact audit JSON</button><//>`}`}

 </div></div></div>`;}
 render(){const s=this.state,phases=phasesFor(s.activity),phase=phaseAt(s.time,s.activity),phaseI=phases.indexOf(phase),nv=s.precision==='edge0',selected=MODULES.find(x=>x.id===s.selected);return html`<div class=${"app-shell"+(s.timelineHidden?" timeline-hidden":"")} style=${{"--font-scale":s.fontScale,"--panel-width":Math.min(490,390*s.fontScale)+"px"}}>
 <header class="topbar" ref=${this.header}><a class="brand header-brand" href="#" onClick=${e=>{e.preventDefault();this.setView('architecture');}} aria-label="Edge0 35B A3B architecture explorer home"><span class="brand-mark" aria-hidden="true"><i/><i/><i/></span><div class="header-wordmark"><div class="eyebrow">INTERACTIVE ARCHITECTURE EXPLORER</div><h1>Edge0 <em>35B A3B</em><span class="title-dot">.</span></h1></div></a><nav class="header-navigation" aria-label="View and checkpoint controls"><div class="view-tabs" role="tablist" aria-label="Visualization view">${[['architecture','Architecture','01'],['storage','Storage','02'],['cache','KV lab','03']].map(([v,label,n])=>html`<button role="tab" aria-selected=${s.view===v} class=${s.view===v?'active':''} onClick=${()=>this.setView(v)}><small>${n}</small>${label}</button>`)}</div><div class="precision-toggle" role="group" aria-label="Checkpoint precision">${Object.entries(MODE_INFO).map(([mode,inf])=>html`<button aria-pressed=${s.precision===mode} class=${s.precision===mode?'active':''} style=${{'--precision':inf.color}} onClick=${()=>this.patch({precision:mode})} title=${inf.note}><b>${inf.short}</b><span>${bytes(TOTALS[mode],s.binary)}</span></button>`)}</div></nav><div class="header-actions"><div class="font-controls" role="group" aria-label="Text size"><button aria-label="Decrease font size" title="Smaller text (-)" disabled=${s.fontScale<=.85} onClick=${()=>this.changeFont(-.1)}>-</button><button class="font-reset" aria-label="Reset font size" title="Reset text size" onClick=${()=>this.patch({fontScale:1})}>${Math.round(s.fontScale*100)}%</button><button aria-label="Increase font size" title="Larger text (+)" disabled=${s.fontScale>=1.5} onClick=${()=>this.changeFont(.1)}>+</button></div><button class="icon-button" title="Show or hide inspector (B)" aria-label="Toggle inspector" aria-controls="inspector-panel" aria-expanded=${s.mobile?s.sheet:!s.panelHidden} onClick=${()=>this.togglePanel()}><${Icon} name="menu"/></button><span class="offline-badge"><i/> OFFLINE-READY</span><button class="icon-button" title="Credits and evidence" aria-label="View sources" onClick=${()=>this.patch({tab:'sources',sheet:s.mobile,panelHidden:false})}><${Icon} name="link"/></button><button class="icon-button" title="Keyboard and mouse controls" aria-label="Help" onClick=${()=>this.patch({modal:'help'})}><${Icon} name="help"/></button></div></header>

  ${s.view==='architecture'&&selected&&html`<div class="expansion-tools"><div class="expansion-switch" role="group" aria-label="Tensor arrangement"><button aria-pressed=${s.detailLayout==='column'} class=${s.detailLayout==='column'?'active':''} onClick=${()=>this.patch({detailLayout:'column'})}>Columns</button><button aria-pressed=${s.detailLayout==='floor'} class=${s.detailLayout==='floor'?'active':''} onClick=${()=>this.patch({detailLayout:'floor'})}>Floor</button></div>${(selected.mode||selected.id.startsWith('D'))&&html`<div class="expansion-switch" role="group" aria-label="Expert representation"><button aria-pressed=${!s.expertView} class=${!s.expertView?'active':''} onClick=${()=>this.patch({expertView:false,expert:null})}>Tensor banks</button><button aria-pressed=${s.expertView} class=${s.expertView?'active':''} onClick=${()=>this.patch({expertView:true,expert:null})}>256 experts</button></div>`}<button class="tool-btn fit-text" onClick=${()=>this.engine&&this.engine.focus(selected.id)}>Fit layer</button><button class="tool-btn" aria-label="Close layer expansion" onClick=${()=>this.patch({selected:null,tensor:null,hoverTensor:null,expert:null})}><${Icon} name="close" size=${11}/> Close</button></div><div class="expansion-caption">${s.detailLayout==='floor'&&!s.expertView?'':s.expertView?'Click an expert to split its gate, up and down matrices.':'Click a label or marker. Full inventory stays in the inspector.'}</div>`}
 <div class="scene-tools"><button class=${'icon-button '+(s.labels?'active':'')} aria-label="Toggle all layer labels" aria-pressed=${s.labels} onClick=${()=>this.patch({labels:!s.labels})} title="Layer labels (L)"><${Icon} name="labels"/></button><button class=${'icon-button '+(s.links?'active':'')} aria-label="Toggle flow paths" aria-pressed=${s.links} onClick=${()=>this.patch({links:!s.links})} title="Flow paths (K)"><${Icon} name="link"/></button><button class="icon-button" aria-label="Reset camera" onClick=${()=>this.engine&&this.engine.reset()} title="Reset view (R)"><${Icon} name="reset"/></button><button class="icon-button" aria-label="Save 3D canvas image" onClick=${()=>this.snapshot()} title="Save canvas image"><${Icon} name="camera"/></button></div>
 <div class="scene-scale"><span class="scale-glyph"/><span>1 cubic unit = 1 GB <em>${s.view==='cache'?'context memory arithmetic':'audited weight payload'} / ${this.engine&&this.engine.renderer.software?'CPU 3D':'WebGL2'}</em></span></div><div class="scene-legend">${(s.view==='cache'?[['full','Full attn KV'],['swa','Recurrent state']]:s.view==='storage'?[['expert','Experts'],['lora','LoRA'],['prerouter','Prerouter']]:[['full','Full attention'],['swa','Gated linear']]).map(([key,l])=>html`<span><i style=${{background:COL[key]}}/>${l}</span>`)}</div>
 ${s.view==='architecture'&&s.activity==='inference'&&(phaseI===1||s.selected==='D0')&&html`<div class="draft-diagram"><div><b>EXPERT FETCH / 8 OF 256</b><small>The prerouter guesses the next layer, so the fetch overlaps compute</small></div><div class="draft-cells">${[.98,.94,.87,.62,.41].map((confidence,i)=>{let step=(s.time>=6?s.time-6:2),stage=step<1.2?'predict':step<2.8?'fetch':i<3?'resident':i===3?'arriving':'queued';return html`<div class=${"draft-cell "+stage}><small>expert ${i*7+3}</small><b>${step<1.2?'...':confidence.toFixed(2)}</b><span>${stage}</span></div>`;})}</div><p>Routing is synthetic; this shows fetch states, not weight volumes.</p></div>`}
 ${nv&&s.view!=='cache'&&html`<div class="format-notice"><b>${bytes(TOTALS.bf16-TOTALS[s.precision],s.binary)} smaller</b> than the BF16 base / measured from shard headers</div>`}${s.error&&html`<div class="graphics-error"><h2>Graphics unavailable</h2><p>${s.error}</p><p>The inspector, configs, benchmarks and byte audit still work. Enable canvas rendering and reload for the 3D scene.</p></div>`}
 </section>
 <div class=${'transport-shell'+(s.timelineHidden?' collapsed':'')}><footer id="animation-panel" class="transport" inert=${s.timelineHidden} aria-hidden=${s.timelineHidden} onPointerMove=${e=>this.blankMove(e,'down')} onPointerLeave=${e=>e.currentTarget.classList.remove('blank-down')} onPointerDown=${e=>this.blankDown(e,'down')} onPointerUp=${e=>this.blankUp(e,'down')}><button class="timeline-collapse" aria-label="Hide animation bar" title="Hide animation bar (T), or click its blank background" onClick=${()=>this.patch({timelineHidden:true})}><${Icon} name="down" size=${15}/></button><div class="story-text"><div><span class="story-phase" style=${{color:phase.color}}>0${phaseI+1} / ${phase.name.toUpperCase()}</span><b>${phase.caption}</b></div><span class="story-number" style=${{color:phase.color}}>${phase.active}<small>${s.activity==='training'?'TRAINING SCHEMATIC':phaseI===0||phaseI===2?'ACTIVE / TOKEN':'SCHEMATIC STEP'}</small></span></div><div class="story-description">${phase.desc}</div><div class="transport-row"><button class="play-button" aria-label=${s.playing?'Pause animation':'Play animation'} onClick=${()=>this.patch({playing:!s.playing})}><${Icon} name=${s.playing?'pause':'play'} size=${18}/></button><div class="timeline"><div class="phase-buttons">${phases.map((p,i)=>html`<button class=${phaseI===i?'active':''} style=${{'--phase':p.color,flex:p.to-p.from}} onClick=${()=>this.seek(p.from+.01)}>${p.label||p.name}</button>`)}</div><input aria-label="Animation timeline" type="range" min="0" max="21.99" step="0.01" value=${s.time} onInput=${e=>this.seek(Number(e.target.value))} style=${{'--progress':s.time/22*100+'%'}}/></div><button class=${'phase-loop '+(s.loopPhase?'active':'')} aria-label="Loop current animation phase" aria-pressed=${s.loopPhase} title="Stay on this phase, or play the whole request story" onClick=${()=>this.patch({loopPhase:!s.loopPhase})}>${s.loopPhase?'Loop phase':'All phases'}</button><select class="speed-select" value=${s.speed} aria-label="Animation speed" onChange=${e=>this.patch({speed:Number(e.target.value)})}>${[.5,1,1.5,2].map(v=>html`<option value=${v}>${v}x</option>`)}</select><button class=${'orbit-button '+(s.orbit?'active':'')} aria-label="Toggle camera auto orbit" aria-pressed=${s.orbit} onClick=${()=>this.patch({orbit:!s.orbit})}>Orbit</button></div><div class="transport-bottom"><span>${s.activity==='training'?'GENERIC TRAINING SCHEMATIC / NO REAL WEIGHT UPDATES':phase.name==='Route'?'* OPTIMIZED PREFILL / NOT THE REFERENCE FORWARD LOOP':'SCHEMATIC FLOW / NOT MEASURED TIMING'}</span><span>drag orbit / right-drag pan / wheel zoom</span></div></footer></div>
 <div class=${'timeline-dock'+(s.timelineHidden?' mini':'')}><button aria-label=${s.timelineHidden?'Show animation bar':'Hide animation bar'} aria-expanded=${!s.timelineHidden} aria-controls="animation-panel" onClick=${()=>this.patch({timelineHidden:!s.timelineHidden})}><${Icon} name=${s.timelineHidden?'up':'down'} size=${14}/><span>${s.timelineHidden?'Animation / '+phase.name:'Hide animation'}</span></button>${s.timelineHidden&&html`<div class="mini-playback"><button aria-label=${s.playing?'Pause animation':'Play animation'} onClick=${()=>this.patch({playing:!s.playing})}><${Icon} name=${s.playing?'pause':'play'} size=${14}/></button><select aria-label="Animation phase" value=${phaseI} onChange=${e=>this.seek(phases[+e.target.value].from+.01)}>${phases.map((p,i)=>html`<option value=${i}>${p.label||p.name}</option>`)}</select></div>`}<span class="weight-state">${s.activity==='training'?'Training schematic / sizes unchanged':phase.name==='Compute'?'Compute / 3B active':phase.name==='Route'?'Route + fetch':'Inference / weights stay fixed'}</span></div>
 </main>${this.renderInspector()}${(s.panelHidden||s.mobile&&!s.sheet)&&html`<button class="inspector-reopen" aria-label="Show inspector" aria-controls="inspector-panel" onClick=${()=>this.togglePanel(true)} title="Show inspector (B)"><${Icon} name="menu" size=${16}/><span>Inspect</span></button>`}</div>${s.mobile&&s.sheet&&html`<div class="sheet-scrim" onClick=${()=>this.patch({sheet:false})}/>`}${this.renderModal()}${s.toast&&html`<div class="toast" role="status">${s.toast}</div>`}</div>`;}
}
render(html`<${App}/>`,document.getElementById('root'));

})();

<script>
/* WebMCP tools for the Tensor Atlas (progressive enhancement).
 *
 * 규격: W3C WebMCP CG Draft / Chrome 149+ origin trial.
 *   - 도구 등록: <modelContext>.registerTool({name, description, inputSchema, execute, annotations})
 *   - 표면은 브라우저 버전에 따라 document.modelContext / navigator.modelContext → 둘 다 감지.
 *   - 실행: getTools() → executeTool(tool, JSON.stringify(args))  / 테스트: navigator.modelContextTesting
 *   - 로컬 확인: chrome://flags/#enable-webmcp-testing → DevTools Application > WebMCP 또는 Inspector 확장
 *   - 미지원 브라우저에서는 아무 것도 하지 않는다(기존 페이지 동작 불변).
 *
 * 이 파일은 build.py 가 index.html 의 WebMCP 자리표시자에 인라인으로 삽입한다(외부 스크립트 아님).
 * 데이터 출처는 페이지가 이미 노출하는 window.ATLAS_DEBUG 뿐이다.
 * 벤치마크 도구를 위해 src.html 의 그 객체에 BENCH, BENCH_MODELS 식별자를 추가했다.
 * 도구 8종: get_model_overview / list_categories / search_tensors / get_tensor_detail /
 *           focus_tensor / get_view_state / list_benchmarks / compare_models
 */
(function () {
  'use strict';

  var mc = null;
  try { mc = document.modelContext || (window.navigator && window.navigator.modelContext) || null; } catch (e) { mc = null; }

  // 진단용 상태 노출 — 미지원일 때 조용히 끝나면 원인을 알 수 없으므로 상태를 남긴다.
  var supported = !!(mc && typeof mc.registerTool === 'function');
  window.__WEBMCP_STATUS = supported ? 'pending' : (mc ? 'unsupported-api-shape' : 'unsupported-browser');
  if (!supported) {
    try {
      console.info('[webmcp] document.modelContext 없음 (status=' + window.__WEBMCP_STATUS + '). ' +
        'Chrome 149+ 에서 chrome://flags/#enable-webmcp-testing 을 Enabled 로 바꾸고 브라우저를 재시작한 뒤, ' +
        'Ctrl+Shift+R 로 새로고침하세요. 콘솔에서 typeof document.modelContext 로 확인 가능.');
    } catch (e) {}
    try {
      var probe = (typeof mc.provideContext === 'function'); // API 표면이 provideContext 뿐인 빌드 대비
      if (probe) { window.__WEBMCP_STATUS = 'provideContext-only'; }
    } catch (e) {}
    if (window.__WEBMCP_STATUS !== 'provideContext-only') { return; }
  }

  var ATLAS_WAIT_MS = 12000;

  function atlas() { return window.ATLAS_DEBUG || null; }

  function waitForAtlas(timeoutMs) {
    var t0 = Date.now();
    return new Promise(function (resolve, reject) {
      (function poll() {
        var d = atlas();
        // engine 은 3D 초기화(WebGL) 실패 시 null 일 수 있다 — 데이터/벤치마크 도구는 불필요
        if (d && d.app) return resolve(d);
        if (Date.now() - t0 > (timeoutMs || ATLAS_WAIT_MS)) return reject(new Error('ATLAS_DEBUG not ready (atlas still loading)'));
        setTimeout(poll, 200);
      })();
    });
  }

  function num(n) { return (n == null ? 0 : n).toLocaleString('en-US'); }
  function billions(n) { return (n / 1e9).toFixed(2) + 'B'; }
  function bytes(n) { return (n / 1e9).toFixed(1) + ' GB'; }

  function allTensors(d) {
    var out = [];
    for (var i = 0; i < d.MODULES.length; i++) {
      var m = d.MODULES[i];
      var ws = m.ws || [];
      for (var j = 0; j < ws.length; j++) {
        out.push({
          module: m.id,
          module_label: m.label || m.id,
          layer: (m.index == null ? null : m.index),
          part: m.part || null,
          mode: m.mode || null,
          name: ws[j].name,
          shape: ws[j].shape,
          format: ws[j].format,
          cat: ws[j].cat,
          count: ws[j].count,
          params: ws[j].p,
          note: ws[j].note || null
        });
      }
    }
    return out;
  }

  function ok(payload) { return JSON.stringify(payload, null, 1); }
  function err(e) { return JSON.stringify({ error: String((e && e.message) || e) }, null, 1); }

  /* ---- model-card benchmark table (페이지가 window.ATLAS_DEBUG.BENCH 로 노출) ---- */
  var METRIC_NOTE = "Percentages or the card's 0-100 score. ZeroBench uses Pass@5, ProgramBench Almost@1, DeepSWE resolved rate (harness: mini-SWE). Do not average unlike metrics; harnesses vary per benchmark.";

  function benchTable(d) {
    var rows = d && d.BENCH, models = d && d.BENCH_MODELS;
    if (!rows || !models) throw new Error('benchmark table not exposed by this page build (window.ATLAS_DEBUG.BENCH missing)');
    return {
      models: models.slice(),
      rows: rows.map(function (r) { return { name: r[0], category: r[1], values: (r[2] || []).slice() }; })
    };
  }

  function ranked(values, models) {
    var all = [], scored = [], missing = [], i, j;
    for (i = 0; i < models.length; i++) all.push({ model: models[i], score: values[i] == null ? null : values[i] });
    for (i = 0; i < all.length; i++) (all[i].score == null ? missing : scored).push(all[i]);
    scored.sort(function (a, b) { return b.score - a.score; });
    var best = scored.length ? scored[0].score : null;
    for (i = 0; i < scored.length; i++) {
      var above = 0;
      for (j = 0; j < scored.length; j++) if (scored[j].score > scored[i].score) above++;
      scored[i].rank = above + 1;
      scored[i].delta_vs_best = best == null ? null : Math.round((scored[i].score - best) * 10) / 10;
    }
    var out = scored.concat(missing.map(function (r) { return { model: r.model, score: null, note: 'not reported' }; }));
    return { ranking: out, reported: scored.length };
  }

  function findRow(t, want) {
    var w = String(want || '').trim().toLowerCase();
    return t.rows.filter(function (r) { return r.name.toLowerCase() === w; })[0] ||
           t.rows.filter(function (r) { return r.name.toLowerCase().indexOf(w) !== -1; })[0] || null;
  }
  function findModel(ranking, want) {
    var w = String(want || '').trim().toLowerCase();
    return ranking.filter(function (r) { return r.model.toLowerCase() === w; })[0] ||
           ranking.filter(function (r) { return r.model.toLowerCase().indexOf(w) !== -1; })[0] || null;
  }

  var TOOLS = [
    {
      name: 'get_model_overview',
      description: 'Return this atlas model\'s headline facts: model_type, architectures, dtype, total parameter count, per-precision totals as offered by the page, layer count and category summary. Use this first to understand what model is on the page.',
      inputSchema: { type: 'object', properties: {}, additionalProperties: false },
      annotations: { readOnlyHint: true },
      execute: function () {
        return waitForAtlas().then(function (d) {
          var cfg = d.CFG || {};
          var cats = (d.CATEGORIES || []).map(function (c) {
            return { key: c[0], label: c[1], tensors: (c[3] || []).length };
          });
          return ok({
            model_type: cfg.model_type || null,
            architectures: cfg.architectures || null,
            dtype: cfg.dtype || null,
            transformers_version: cfg.transformers_version || null,
            quantization_config: cfg.quantization_config || null,
            total_params: d.TOTAL_P,
            total_params_label: billions(d.TOTAL_P),
            totals_by_precision: d.TOTALS || null,
            layer_modules: d.MODULES.length,
            categories: cats,
            current_precision: d.app.state.precision
          });
        }).catch(err);
      }
    },
    {
      name: 'list_categories',
      description: 'List the atlas tensor categories (e.g. routed experts, attention, vision) with their tensor counts and total parameter counts, so an agent can decide where to look.',
      inputSchema: { type: 'object', properties: {}, additionalProperties: false },
      annotations: { readOnlyHint: true },
      execute: function () {
        return waitForAtlas().then(function (d) {
          var rows = (d.CATEGORIES || []).map(function (c) {
            var ws = c[3] || [], params = 0;
            for (var i = 0; i < ws.length; i++) params += (ws[i].p || 0);
            return { key: c[0], label: c[1], color: c[2], tensors: ws.length, params: params, params_label: billions(params) };
          });
          return ok({ categories: rows, total_tensors: allTensors(d).length });
        }).catch(err);
      }
    },
    {
      name: 'search_tensors',
      description: 'Search weight tensors by name substring, category, or storage format (e.g. "experts.w1", cat "attention", format "fp4"). Returns matching tensor names with shapes, formats, parameter counts and the module/layer they belong to.',
      inputSchema: {
        type: 'object',
        properties: {
          query: { type: 'string', description: 'Substring to match against the tensor name (case-insensitive). Leave empty to match all.' },
          category: { type: 'string', description: 'Exact category key as returned by list_categories (e.g. attention, expert, vision).' },
          format: { type: 'string', description: 'Storage format as reported in the tensor data (e.g. fp8, fp4, bf16).' },
          module: { type: 'string', description: 'Restrict to one module id, e.g. embed or L0.' },
          limit: { type: 'integer', description: 'Max rows to return (default 20, max 200).' }
        },
        additionalProperties: false
      },
      annotations: { readOnlyHint: true },
      execute: function (a) {
        a = a || {};
        return waitForAtlas().then(function (d) {
          var q = (a.query || '').toLowerCase();
          var lim = Math.min(Math.max(parseInt(a.limit, 10) || 20, 1), 200);
          var rows = allTensors(d).filter(function (t) {
            if (q && String(t.name).toLowerCase().indexOf(q) === -1) return false;
            if (a.category && t.cat !== a.category) return false;
            if (a.format && t.format !== a.format) return false;
            if (a.module && t.module !== a.module) return false;
            return true;
          });
          return ok({
            total_matches: rows.length,
            returned: Math.min(rows.length, lim),
            tensors: rows.slice(0, lim).map(function (t) {
              return { name: t.name, module: t.module, cat: t.cat, format: t.format, shape: t.shape, count: t.count, params: t.params };
            })
          });
        }).catch(err);
      }
    },
    {
      name: 'get_tensor_detail',
      description: 'Fetch the full record for one tensor by exact name (as returned by search_tensors), including its shape, storage format, parameter count, and the explanatory note the atlas shows in its inspector panel.',
      inputSchema: {
        type: 'object',
        properties: { name: { type: 'string', description: 'Exact tensor name, e.g. "ffn.experts.w1.weight".' } },
        required: ['name'],
        additionalProperties: false
      },
      annotations: { readOnlyHint: true },
      execute: function (a) {
        a = a || {};
        return waitForAtlas().then(function (d) {
          var name = String(a.name || '');
          var hits = allTensors(d).filter(function (t) { return t.name === name; });
          if (!hits.length) {
            var near = allTensors(d).filter(function (t) { return t.name.indexOf(name) !== -1; }).slice(0, 10);
            return ok({ found: false, requested: name, suggestions: near.map(function (t) { return t.name; }) });
          }
          if (hits.length > 1) {
            return ok({ found: true, ambiguous: true, matches: hits.map(function (t) { return { name: t.name, module: t.module, cat: t.cat, shape: t.shape, format: t.format, count: t.count, params: t.params, note: t.note }; }) });
          }
          return ok({ found: true, tensor: hits[0] });
        }).catch(err);
      }
    },
    {
      name: 'focus_tensor',
      description: 'Navigate the atlas to a tensor so the user sees it highlighted in the 3D view and the inspector panel (uses the page\'s own selection logic). Use after search_tensors/get_tensor_detail. Returns the resulting view state.',
      inputSchema: {
        type: 'object',
        properties: {
          name: { type: 'string', description: 'Tensor name to focus, e.g. "ffn.experts.w1.weight".' },
          module: { type: 'string', description: 'Optional module id to disambiguate (e.g. L0).' }
        },
        required: ['name'],
        additionalProperties: false
      },
      annotations: { readOnlyHint: false, consequentialHint: false },
      execute: function (a) {
        a = a || {};
        return waitForAtlas().then(function (d) {
          var name = String(a.name || '');
          var modId = a.module || null;
          var hit = null;
          var list = allTensors(d);
          for (var i = 0; i < list.length; i++) {
            if (list[i].name === name && (!modId || list[i].module === modId)) { hit = list[i]; break; }
          }
          if (!hit) return ok({ focused: false, reason: 'tensor not found', requested: name, module: modId });
          if (typeof d.app.select !== 'function') return ok({ focused: false, reason: 'view control unavailable (3D engine not initialised in this browser)' });
          d.app.select(hit.module, name);
          // React 상태 반영을 기다린 뒤 스냅샷 (즉시 읽으면 selected가 null로 나온다)
          return new Promise(function (resolve) {
            setTimeout(function () {
              var s = d.app.state;
              resolve(ok({ focused: true, module: hit.module, tensor: name, cat: hit.cat, format: hit.format, view: s.view, precision: s.precision, selected: s.selected, selected_tensor: s.tensor }));
            }, 200);
          });
        }).catch(err);
      }
    },
    {
      name: 'get_view_state',
      description: 'Report what the user is currently looking at in the atlas: view mode, precision, layout, selected module/tensor, filter, and animation state. Use it to answer "what am I looking at" or to stay in sync with the user.',
      inputSchema: { type: 'object', properties: {}, additionalProperties: false },
      annotations: { readOnlyHint: true },
      execute: function () {
        return waitForAtlas().then(function (d) {
          var s = d.app.state;
          return ok({
            view: s.view, precision: s.precision, layout: s.layout, filter: s.filter,
            selected_module: s.selected, selected_tensor: s.tensor, hover_tensor: s.hoverTensor,
            playing: s.playing, timeline_time: s.time, expert_view: s.expertView, detail_layout: s.detailLayout
          });
        }).catch(err);
      }
    },
    {
      name: 'list_benchmarks',
      description: 'List every reported evaluation on this atlas model card (reasoning, agentic, visual) with each model\'s score and rank, so an agent can choose a benchmark to compare. Use compare_models for a focused head-to-head.',
      inputSchema: {
        type: 'object',
        properties: { category: { type: 'string', description: 'Optional filter: Reasoning, Agentic or Visual.' } },
        additionalProperties: false
      },
      annotations: { readOnlyHint: true },
      execute: function (a) {
        a = a || {};
        return waitForAtlas().then(function (d) {
          var t = benchTable(d);
          var rows = t.rows.filter(function (r) {
            return !a.category || String(r.category).toLowerCase() === String(a.category).toLowerCase();
          });
          return ok({
            models: t.models,
            count: rows.length,
            metric_note: METRIC_NOTE,
            benchmarks: rows.map(function (r) {
              return { name: r.name, category: r.category, ranking: ranked(r.values, t.models).ranking };
            })
          });
        }).catch(err);
      }
    },
    {
      name: 'compare_models',
      description: 'Compare models on one reported benchmark of this model card. Give a benchmark name (e.g. "DeepSWE v1.1") and optionally the models to compare (e.g. ["Edge0 35B A3B (this atlas)", "GLM-5.3"]); returns each score with rank and delta vs the best reported score, plus the metric caveat.',
      inputSchema: {
        type: 'object',
        properties: {
          benchmark: { type: 'string', description: 'Benchmark name from list_benchmarks, e.g. "DeepSWE v1.1" (partial match allowed).' },
          models: { type: 'array', items: { type: 'string' }, description: 'Optional subset of models to focus the comparison on (partial names allowed).' }
        },
        required: ['benchmark'],
        additionalProperties: false
      },
      annotations: { readOnlyHint: true },
      execute: function (a) {
        a = a || {};
        return waitForAtlas().then(function (d) {
          var t = benchTable(d);
          if (!a.benchmark) return ok({ error: 'benchmark is required', available: t.rows.map(function (r) { return r.name; }) });
          var row = findRow(t, a.benchmark);
          if (!row) return ok({ error: 'benchmark not found: ' + a.benchmark, available: t.rows.map(function (r) { return r.name; }) });
          var r = ranked(row.values, t.models);
          var focus = null;
          if (a.models && a.models.length) {
            focus = a.models.map(function (m) {
              var hit = findModel(r.ranking, m);
              return hit || { model: m, error: 'model not in table' };
            });
            if (focus.length === 2 && !focus[0].error && !focus[1].error && focus[0].score != null && focus[1].score != null) {
              var hi = focus[0].score >= focus[1].score ? focus[0] : focus[1];
              var lo = focus[0].score >= focus[1].score ? focus[1] : focus[0];
              focus.push({
                head_to_head: hi.model + ' vs ' + lo.model,
                delta: Math.round((hi.score - lo.score) * 10) / 10,
                relative_percent: Math.round(((hi.score - lo.score) / lo.score) * 1000) / 10,
                leader: hi.model
              });
            }
          }
          return ok({
            benchmark: row.name,
            category: row.category,
            reported_models: r.reported,
            ranking: r.ranking,
            selected: focus,
            metric_note: METRIC_NOTE
          });
        }).catch(err);
      }
    }
  ];

  function register(list) {
    // registerTool 우선, 없으면 provideContext({tools}) 로 폴백 (API 표면 변동 대응)
    if (typeof mc.registerTool !== 'function' && typeof mc.provideContext === 'function') {
      try {
        mc.provideContext({ tools: list });
        window.__WEBMCP_STATUS = 'registered (provideContext)';
        try { console.log('[webmcp] atlas tools provided via provideContext:', list.length); } catch (e) {}
      } catch (e) {
        window.__WEBMCP_STATUS = 'provideContext-failed';
        try { console.warn('[webmcp] provideContext failed', e); } catch (e2) {}
      }
      return;
    }
    var i = 0;
    (function next() {
      if (i >= list.length) {
        window.__WEBMCP_STATUS = 'registered (' + list.length + ' tools)';
        try { console.log('[webmcp] atlas tools registered:', list.length, list.map(function (t) { return t.name; })); } catch (e) {}
        return;
      }
      var tool = list[i++];
      try {
        var p = mc.registerTool(tool);
        if (p && typeof p.then === 'function') { p.then(next, next); } else { next(); }
      } catch (e) {
        try { console.warn('[webmcp] registerTool failed for', tool.name, e); } catch (e2) {}
        next();
      }
    })();
  }

  // 디버깅/자동검증용 진입점 (inspector 확장 없이도 호출 가능)
  window.__WEBMCP_ATLAS = {
    tools: TOOLS,
    call: function (name, args) {
      for (var i = 0; i < TOOLS.length; i++) {
        if (TOOLS[i].name === name) return Promise.resolve(TOOLS[i].execute(args || {}));
      }
      return Promise.reject(new Error('unknown tool: ' + name));
    }
  };

  register(TOOLS);
})();

</script>
